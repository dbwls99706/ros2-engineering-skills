name: Diagnostic C++ fleet shutdown

# Temporary, diagnostic-branch only (r5 ASan rerun). The main r5 run (1d1b6ab, run 39362909806)
# rebuilt Fast DDS in four variants and ran all 20 arms; its 16 non-ASan arms stand as they are.
# This revision reruns only the four ASan arms on the same build artifacts (BUILD_RUN_ID, checked
# by checks.txt and the library sha256), with ASan on the nodes only and a startup probe that
# decides whether the 30-minute arm runs. Stage 0 proves core capture again; every image is built
# on the base image digest used in r4.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

env:
  CORE_PATTERN: /var/crash-cores/core.%e.%p.%t
  BASE_IMAGE: osrf/ros:humble-desktop@sha256:fb07245b32187d74350be25323d8ad2f8ca5c25c325759911a1eff2267a49c1e
  BASE_DIGEST: sha256:fb07245b32187d74350be25323d8ad2f8ca5c25c325759911a1eff2267a49c1e
  STOCK_LIB_SHA256: 148cd881ab04a1ffeb27c15ebd5f7a08d4e3fe02d203582e812d3464a9c17b09
  V172_SHA: 3ac5064df47decd7776ed03c7350b2ac1435cb5f
  BUILD_RUN_ID: '39362909806'

jobs:
  core-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Write kernel cores to a fixed host directory
        run: |
          echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          EVIDENCE="$RUNNER_TEMP/evidence"
          mkdir -p "$EVIDENCE/stage0"
          sudo systemctl stop apport.service 2>/dev/null || true
          sudo mkdir -p /var/crash-cores
          sudo chmod 1777 /var/crash-cores
          sudo sysctl -w "kernel.core_pattern=$CORE_PATTERN"
          cat /proc/sys/kernel/core_pattern | tee "$EVIDENCE/stage0/host-core-pattern.txt"
          test "$(cat /proc/sys/kernel/core_pattern)" = "$CORE_PATTERN"
      - name: Build the CI image on the pinned base, then the diagnostic layer
        run: |
          docker pull "$BASE_IMAGE"
          docker tag "$BASE_IMAGE" osrf/ros:humble-desktop
          mkdir -p tests/fastdds-debs
          timeout --signal=TERM --kill-after=10s 20m docker buildx build --load --progress=plain \
            -f tests/Dockerfile.ros2-test --build-arg ROS_DISTRO=humble -t ros2-ci:humble . \
            > "$EVIDENCE/stage0/build-ci.log" 2>&1 || { tail -100 "$EVIDENCE/stage0/build-ci.log"; exit 1; }
          docker image inspect osrf/ros:humble-desktop --format '{{json .RepoDigests}}' \
            > "$EVIDENCE/stage0/base-image.txt"
          grep -q "$BASE_DIGEST" "$EVIDENCE/stage0/base-image.txt"
          timeout --signal=TERM --kill-after=10s 20m docker build --progress=plain \
            -f tests/Dockerfile.diag-core --build-arg BASE=ros2-ci:humble --build-arg UPGRADE=none \
            --build-arg FASTDDS_VARIANT=stock -t ros2-diag:humble tests \
            > "$EVIDENCE/stage0/build-diag.log" 2>&1 || { tail -100 "$EVIDENCE/stage0/build-diag.log"; exit 1; }
      - name: Deliberate SIGSEGV, core capture, and gdb with Fast DDS symbols
        run: |
          timeout --signal=TERM --kill-after=10s 15m docker run --rm --init --network none \
            -e ROS_DOMAIN_ID=83 -e ROS_LOCALHOST_ONLY=1 --ulimit core=-1 \
            -v /var/crash-cores:/var/crash-cores -v "$EVIDENCE:/evidence" \
            ros2-diag:humble bash tests/diag_core_pipeline.sh
      - name: Retain stage 0 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage0-core-pipeline
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14

  core-pipeline-verify:
    needs: core-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Download the stage 0 artifact and check it again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name stage0-core-pipeline --dir "$RUNNER_TEMP/downloaded"
          python3 tests/diag_core_check.py "$RUNNER_TEMP/downloaded/stage0"

  compare:
    needs: core-pipeline-verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # E: demo talker + listener, same harness and 30-minute iteration budget as r4. ASan arms
        # are auxiliary and excluded from rate tests.
        include:
          - {arm: EAR, shard: 1, mode: minimal, variant: rebuilt-asan, asan: 'on'}
          - {arm: EAR, shard: 2, mode: minimal, variant: rebuilt-asan, asan: 'on'}
          - {arm: EAP, shard: 1, mode: minimal, variant: patched-asan, asan: 'on'}
          - {arm: EAP, shard: 2, mode: minimal, variant: patched-asan, asan: 'on'}
    env:
      DIAG_LABEL: ${{ matrix.arm }}-${{ matrix.shard }}
      DIAG_MODE: ${{ matrix.mode }}
      DIAG_VARIANT: ${{ matrix.variant }}
      DIAG_ASAN: ${{ matrix.asan }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: diag
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.V172_SHA }}
          path: src
      - name: Overlay the diagnostic tools on the base revision
        run: |
          echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          EVIDENCE="$RUNNER_TEMP/evidence"
          mkdir -p "$EVIDENCE/identity"
          {
            echo "diag_commit=$GITHUB_SHA"
            echo "base_commit=$(git -C src rev-parse HEAD)"
            for file in diag_fleet_cpp_repro.py diag_gdb_inspect.py segv_backtrace.c; do
              if git -C src cat-file -e "HEAD:tests/$file" 2>/dev/null; then
                echo "overlay tests/$file replaces base blob $(git -C src rev-parse "HEAD:tests/$file")"
              else
                echo "overlay tests/$file is new to the base"
              fi
              cp "diag/tests/$file" "src/tests/$file"
            done
            sha256sum src/tests/diag_fleet_cpp_repro.py src/tests/diag_gdb_inspect.py \
              src/tests/check_generated_fleet.py src/tests/smoke_test_nodes.py \
              src/scripts/create_package.py src/scripts/launch_supervisor.py \
              src/tests/Dockerfile.ros2-test diag/tests/Dockerfile.diag-core \
              diag/tests/diag_fastdds_listener_race.patch diag/tests/diag_fastdds_build.sh
            git -C src status --porcelain
          } | tee "$EVIDENCE/identity/source.txt"
      - name: Write kernel cores to a fixed host directory
        run: |
          sudo systemctl stop apport.service 2>/dev/null || true
          sudo mkdir -p /var/crash-cores
          sudo chmod 1777 /var/crash-cores
          sudo sysctl -w "kernel.core_pattern=$CORE_PATTERN"
          cat /proc/sys/kernel/core_pattern | tee "$EVIDENCE/identity/host-core-pattern.txt"
          test "$(cat /proc/sys/kernel/core_pattern)" = "$CORE_PATTERN"
          { nproc; lscpu; free -m; uname -a; } > "$EVIDENCE/identity/runner.txt"
      - name: Fetch this arm's Fast DDS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diag/tests/fastdds-debs
          if [ "$DIAG_VARIANT" = stock ]; then
            echo "$STOCK_LIB_SHA256" > "$RUNNER_TEMP/expected-lib.sha256"
          else
            gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "fastdds-$DIAG_VARIANT" --dir "$RUNNER_TEMP/fastdds"
            cp "$RUNNER_TEMP/fastdds/ros-humble-fastrtps.deb" "$RUNNER_TEMP/fastdds/ros-humble-fastrtps-dbgsym.deb" \
              diag/tests/fastdds-debs/
            cp "$RUNNER_TEMP/fastdds/checks.txt" "$EVIDENCE/identity/fastdds-build-checks.txt"
            grep -qx 'status=pass' "$RUNNER_TEMP/fastdds/checks.txt"
            sed -n 's/^library_sha256=//p' "$RUNNER_TEMP/fastdds/checks.txt" > "$RUNNER_TEMP/expected-lib.sha256"
          fi
          cat "$RUNNER_TEMP/expected-lib.sha256" | tee "$EVIDENCE/identity/expected-fastdds-lib.sha256"
      - name: Build the CI image on the pinned base, then the diagnostic layer
        run: |
          docker pull "$BASE_IMAGE"
          docker tag "$BASE_IMAGE" osrf/ros:humble-desktop
          timeout --signal=TERM --kill-after=10s 20m docker buildx build --load --progress=plain \
            -f src/tests/Dockerfile.ros2-test --build-arg ROS_DISTRO=humble -t ros2-ci:humble src \
            > "$EVIDENCE/identity/build-ci.log" 2>&1 || { tail -100 "$EVIDENCE/identity/build-ci.log"; exit 1; }
          docker image inspect osrf/ros:humble-desktop --format '{{json .RepoDigests}}' \
            > "$EVIDENCE/identity/base-image.txt"
          grep -q "$BASE_DIGEST" "$EVIDENCE/identity/base-image.txt"
          timeout --signal=TERM --kill-after=10s 25m docker build --progress=plain \
            -f diag/tests/Dockerfile.diag-core --build-arg BASE=ros2-ci:humble --build-arg UPGRADE=none \
            --build-arg FASTDDS_VARIANT="$DIAG_VARIANT" -t ros2-diag:humble diag/tests \
            > "$EVIDENCE/identity/build-diag.log" 2>&1 || { tail -100 "$EVIDENCE/identity/build-diag.log"; exit 1; }
          docker image inspect ros2-ci:humble ros2-diag:humble \
            --format '{{.Id}} {{json .RepoTags}}' | tee "$EVIDENCE/identity/images.txt"
          installed="$(docker run --rm ros2-diag:humble cat /opt/diag/fastdds-lib.sha256)"
          echo "installed=$installed" | tee -a "$EVIDENCE/identity/expected-fastdds-lib.sha256"
          test "$installed" = "$(cat "$RUNNER_TEMP/expected-lib.sha256")"
          if [ "$DIAG_ASAN" = on ]; then
            stock="$(docker run --rm ros2-diag:humble cat /opt/diag/stock-fastdds.sha256)"
            echo "stock_copy=$stock" | tee -a "$EVIDENCE/identity/expected-fastdds-lib.sha256"
            test "$stock" = "$STOCK_LIB_SHA256"
          fi
      - name: Probe talker and listener once under ASan
        id: probe
        run: |
          code=0
          timeout --signal=TERM --kill-after=30s 10m docker run --rm --init --network none \
            -e ROS_DOMAIN_ID=83 -e ROS_LOCALHOST_ONLY=1 --ulimit core=-1 \
            -e GITHUB_SHA -e BASE_SHA="$V172_SHA" -e DIAG_LABEL \
            -v /var/crash-cores:/var/crash-cores -v "$EVIDENCE:/evidence" ros2-diag:humble \
            bash -c 'source /opt/ros/humble/setup.bash && exec python3 tests/diag_fleet_cpp_repro.py \
              --mode minimal --asan on --asan-probe --label "$DIAG_LABEL"' || code=$?
          verdict="$(head -1 "$EVIDENCE/asan-probe/verdict.txt" 2>/dev/null || true)"
          echo "probe exit $code, verdict ${verdict:-none}"
          echo "verdict=${verdict:-setup-invalid}" >> "$GITHUB_OUTPUT"
      - name: Repeat the arm for a 30-minute iteration budget
        if: steps.probe.outputs.verdict == 'clean' || steps.probe.outputs.verdict == 'clean-known-race'
        run: |
          timeout --signal=TERM --kill-after=30s 45m docker run --rm --init --network none \
            -e ROS_DOMAIN_ID=83 -e ROS_LOCALHOST_ONLY=1 --ulimit core=-1 \
            -e GITHUB_SHA -e BASE_SHA="$V172_SHA" -e DIAG_LABEL -e DIAG_MODE -e DIAG_ASAN \
            -v /var/crash-cores:/var/crash-cores -v "$EVIDENCE:/evidence" ros2-diag:humble \
            bash -c 'source /opt/ros/humble/setup.bash && exec python3 tests/diag_fleet_cpp_repro.py \
              --minutes 30 --mode "$DIAG_MODE" --shim off --control-main off --asan "$DIAG_ASAN" \
              --label "$DIAG_LABEL"'
      - name: Record cores left on the host and print the ASan reports
        if: always()
        run: |
          cat /proc/sys/kernel/core_pattern > "$EVIDENCE/identity/host-core-pattern-after.txt" || true
          sudo ls -la /var/crash-cores > "$EVIDENCE/identity/host-cores-after.txt" 2>&1 || true
          # The containers write as root; run 39362909806 could not read its ASan reports (EACCES).
          sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE"
          for report in "$EVIDENCE"/asan-probe/python.* "$EVIDENCE"/asan-probe/node.* "$EVIDENCE"/asan/asan.*; do
            [ -f "$report" ] || continue
            echo "::group::$(basename "$(dirname "$report")")/$(basename "$report")"
            head -c 12000 "$report"
            echo "::endgroup::"
          done
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compare-${{ matrix.arm }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Fail when the probe stopped the arm
        if: always()
        env:
          VERDICT: ${{ steps.probe.outputs.verdict }}
        run: |
          echo "probe verdict: ${VERDICT:-not run}"
          case "$VERDICT" in clean|clean-known-race) ;; *) exit 1 ;; esac
