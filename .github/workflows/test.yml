name: Test

on:
  push:
    branches:
      - main
      - master
      # Conventional-Commit branch prefixes (see CLAUDE.md "Branch names").
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'test/**'
      - 'ci/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -------------------------------------------------------
  # Job 0: Commit message policy (CLAUDE.md "Commit messages")
  #
  # This is the authoritative check. The PreToolUse hook in .claude/ only
  # sees Bash command strings, so it misses `git commit -F`, editor-typed
  # messages, and anything committed outside Claude Code. This job reads
  # the real commit objects on the branch instead.
  # -------------------------------------------------------
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject tool-attribution trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Only ever inspect the commits this branch adds. Scanning all of
          # history would fail the build on messages that predate the rule
          # and can no longer be changed without a rewrite.
          if [ -n "${BASE_SHA}" ]; then
            commits="$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"
          elif git rev-parse --verify --quiet origin/main >/dev/null 2>&1; then
            commits="$(git rev-list "origin/main..${HEAD_SHA}")"
          else
            commits="$(git rev-list --max-count=20 "${HEAD_SHA}")"
          fi
          failed=0
          for sha in ${commits}; do
            msg="$(git log -1 --format=%B "${sha}")"
            # Anchored to line starts: a trailer is a line, and matching
            # anywhere would reject a commit whose body names the rule.
            if printf '%s' "${msg}" | grep -qiE \
              '^[ >*+-]*(co-authored-by:|claude-session:|(🤖 *)?generated with|(🤖 *)?created with)|https?://claude\.ai/|🤖'
            then
              echo "::error::${sha} carries a tool-attribution trailer"
              printf '%s\n' "${msg}" | head -20
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "See CLAUDE.md 'Commit messages'." >&2
            exit 1
          fi
          echo "No tool-attribution trailers found."

  # -------------------------------------------------------
  # Job 1: Static analysis (flake8 + mypy)
  # -------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: flake8
        run: flake8 scripts/ tests/ .claude/hooks/
      - name: mypy
        run: mypy scripts/ --ignore-missing-imports
      - name: pip-audit (current environment)
        # Best-effort dependency vulnerability scan over the installed env.
        # Deliberately non-blocking, and it is NOT a gate: the audit covers
        # whatever the runner image ships (setuptools, wheel, urllib3, ...),
        # so unrelated advisories would otherwise redden every PR. What this
        # project actually enforces is the version floors in
        # requirements-dev.txt — when an advisory here names one of our own
        # dependencies, raise its floor there.
        continue-on-error: true
        run: pip-audit --desc

  # -------------------------------------------------------
  # Job 2: Unit tests with coverage (fast, no Docker needed)
  # -------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=scripts --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml

  # -------------------------------------------------------
  # Job 3: ROS 2 distro integration tests (Docker-based)
  #
  # `rolling` cannot be date-pinned — snapshots.ros.org does not publish the
  # URL pattern apt expects for it. Instead, tests/Dockerfile.ros2-test
  # source-overlays the upstream repos whose binaries are currently
  # inconsistent (rosidl*, control_msgs, ros2_control) onto /opt/ros/rolling,
  # so transient upstream package-set breakage doesn't leak into the signal.
  # -------------------------------------------------------
  ros2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy, kilted, lyrical, rolling]
    steps:
      - uses: actions/checkout@v6

      - name: Verify Docker image exists
        run: docker pull osrf/ros:${{ matrix.ros_distro }}-desktop

      - name: Build and test in ROS 2 ${{ matrix.ros_distro }}
        run: |
          docker build \
            -f tests/Dockerfile.ros2-test \
            --build-arg ROS_DISTRO=${{ matrix.ros_distro }} \
            --progress=plain \
            -t ros2-test:${{ matrix.ros_distro }} \
            .

  # -------------------------------------------------------
  # Job 4: Markdown lint for reference files
  # -------------------------------------------------------
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            references/*.md
            SKILL.md
            README.md

  # -------------------------------------------------------
  # Job 5: Validate scripts and generated code
  # -------------------------------------------------------
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check scripts syntax
        run: |
          python -m py_compile scripts/create_package.py
          python -m py_compile scripts/qos_checker.py
          python -m py_compile scripts/launch_validator.py
      - name: Verify --version works
        run: |
          python scripts/create_package.py --version
          python scripts/qos_checker.py --version
          python scripts/launch_validator.py --version
      - name: Run launch validator on generated packages
        run: |
          mkdir -p /tmp/test_pkgs
          python scripts/create_package.py test_cpp --type cpp --dest /tmp/test_pkgs
          python scripts/create_package.py test_py --type python --dest /tmp/test_pkgs
          python scripts/launch_validator.py /tmp/test_pkgs/

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run eval_runner structural smoke check (fails if any eval criterion drifts)
        # This is the CI gate for evals/expected fixtures vs eval.yaml
        # criteria. Default thresholds (coverage 0.30, pass-rate 80) match
        # the documented contract in docs/EVAL_WORKFLOW.md.
        run: python scripts/eval_runner.py
