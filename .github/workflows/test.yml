name: Test

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'test/**'
      - 'ci/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-start:
    if: ${{ github.event_name == 'push' && github.ref_name == 'chore/repository-readiness-staging' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Record workflow run id
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          printf 'run_id=%s\nsha=%s\n' "${GITHUB_RUN_ID}" "${GITHUB_SHA}" \
            > .github/ci-start.txt
          git config user.name dbwls99706
          git config user.email yujinhong3@gmail.com
          git add .github/ci-start.txt
          git commit -m 'ci: record validation run [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject tool-attribution trailers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "${zero}" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              range="${BEFORE_SHA}..${HEAD_SHA}"
            else
              range="${HEAD_SHA}~1..${HEAD_SHA}"
            fi
          elif git rev-parse --verify --quiet \
               "origin/${DEFAULT_BRANCH}" >/dev/null 2>&1; then
            range="origin/${DEFAULT_BRANCH}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}~1..${HEAD_SHA}"
          fi
          echo "Inspecting ${range}"
          commits="$(git rev-list "${range}")"
          if [ -z "${commits}" ]; then
            echo "No new commits to inspect."
          fi
          failed=0
          for sha in ${commits}; do
            msg="$(git log -1 --format=%B "${sha}")"
            if printf '%s' "${msg}" | grep -qiE \
              '^[ >*+-]*(co-authored-by:|claude-session:|(🤖 *)?generated with|(🤖 *)?created with)|https?://claude\.ai/|🤖'
            then
              echo "::error::${sha} carries a tool-attribution trailer"
              printf '%s\n' "${msg}" | head -20
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: flake8
        run: flake8 scripts/ tests/ .claude/hooks/
      - name: mypy
        run: mypy scripts/ --ignore-missing-imports
      - name: pip-audit (current environment)
        continue-on-error: true
        run: pip-audit --desc

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=scripts --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml

  ros2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy, kilted, lyrical, rolling]
    steps:
      - uses: actions/checkout@v6
      - name: Verify Docker image exists
        run: docker pull osrf/ros:${{ matrix.ros_distro }}-desktop
      - name: Build and test in ROS 2 ${{ matrix.ros_distro }}
        run: |
          docker build \
            -f tests/Dockerfile.ros2-test \
            --build-arg ROS_DISTRO=${{ matrix.ros_distro }} \
            --progress=plain \
            -t ros2-test:${{ matrix.ros_distro }} \
            .

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            references/*.md
            SKILL.md
            README.md

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check scripts syntax
        run: |
          python -m py_compile scripts/create_package.py
          python -m py_compile scripts/qos_checker.py
          python -m py_compile scripts/launch_validator.py
      - name: Verify --version works
        run: |
          python scripts/create_package.py --version
          python scripts/qos_checker.py --version
          python scripts/launch_validator.py --version
      - name: Run launch validator on generated packages
        run: |
          mkdir -p /tmp/test_pkgs
          python scripts/create_package.py test_cpp --type cpp --dest /tmp/test_pkgs
          python scripts/create_package.py test_py --type python --dest /tmp/test_pkgs
          python scripts/launch_validator.py /tmp/test_pkgs/
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run eval fixture validation
        run: python scripts/eval_runner.py

  ci-report:
    if: ${{ always() && github.event_name == 'push' && github.ref_name == 'chore/repository-readiness-staging' && !contains(github.event.head_commit.message, '[skip ci]') }}
    needs:
      - ci-start
      - commit-messages
      - lint
      - unit-tests
      - ros2-integration
      - markdown-lint
      - lint-scripts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT_MESSAGES_RESULT: ${{ needs.commit-messages.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
      ROS2_INTEGRATION_RESULT: ${{ needs.ros2-integration.result }}
      MARKDOWN_LINT_RESULT: ${{ needs.markdown-lint.result }}
      LINT_SCRIPTS_RESULT: ${{ needs.lint-scripts.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Record validation results
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "commit_messages=${COMMIT_MESSAGES_RESULT}"
            echo "lint=${LINT_RESULT}"
            echo "unit_tests=${UNIT_TESTS_RESULT}"
            echo "ros2_integration=${ROS2_INTEGRATION_RESULT}"
            echo "markdown_lint=${MARKDOWN_LINT_RESULT}"
            echo "lint_scripts=${LINT_SCRIPTS_RESULT}"
            echo
            echo "--- failed job logs ---"
          } > .github/ci-report.txt
          gh run view "${GITHUB_RUN_ID}" --log-failed \
            >> .github/ci-report.txt 2>&1 || true
          git config user.name dbwls99706
          git config user.email yujinhong3@gmail.com
          git add .github/ci-report.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record validation results [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
