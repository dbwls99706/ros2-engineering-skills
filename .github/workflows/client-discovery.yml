name: Client discovery

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**', 'ci/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record reproducible input revision
        run: |
          mkdir -p "$RUNNER_TEMP/discovery"
          git rev-parse HEAD > "$RUNNER_TEMP/discovery/revision.txt"
          git archive --format=zip HEAD > "$RUNNER_TEMP/discovery/source.zip"
          sha256sum "$RUNNER_TEMP/discovery/source.zip" > "$RUNNER_TEMP/discovery/source.sha256"
      - name: Install pinned clients and runtime dependencies
        run: |
          npm install --global @openai/codex@0.153.4 @google/gemini-cli@0.58.0
          python -m pip install -r requirements.txt
      - name: Check discovery parser
        run: node --test tests/test_codex_discovery.mjs
      - name: Verify Codex discovery before and after installation
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/codex-discovery-home"
          export CODEX_HOME="$HOME/.codex"
          work="$RUNNER_TEMP/codex-discovery-work"
          out="$RUNNER_TEMP/discovery"
          mkdir -p "$CODEX_HOME" "$work" "$out"
          unset OPENAI_API_KEY CODEX_API_KEY
          codex --version | tee "$out/codex-version.txt"
          node tests/check_codex_discovery.mjs "$work" absent | tee "$out/codex-before.json"
          python scripts/install_skill.py --client codex
          node tests/check_codex_discovery.mjs "$work" \
            "$HOME/.agents/skills/ros2-engineering-skills/SKILL.md" | tee "$out/codex-after.json"
      - name: Verify Gemini discovery before and after installation
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/gemini-discovery-home"
          export NO_COLOR=1
          export TERM=dumb
          work="$RUNNER_TEMP/gemini-discovery-work"
          out="$RUNNER_TEMP/discovery"
          mkdir -p "$HOME" "$work" "$out"
          unset GEMINI_API_KEY GOOGLE_API_KEY GOOGLE_APPLICATION_CREDENTIALS
          gemini --version | tee "$out/gemini-version.txt"
          (cd "$work" && timeout 60 gemini skills list) | tee "$out/gemini-before.txt"
          if grep -Fq 'ros2-engineering-skills' "$out/gemini-before.txt"; then
            echo 'Negative control unexpectedly discovered the skill' >&2
            exit 1
          fi
          python scripts/install_skill.py --client gemini
          (cd "$work" && timeout 60 gemini skills list) | tee "$out/gemini-after.txt"
          grep -Fx 'ros2-engineering-skills [Enabled]' "$out/gemini-after.txt"
          grep -F "$HOME/.gemini/skills/ros2-engineering-skills" "$out/gemini-after.txt"
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: client-discovery
          path: ${{ runner.temp }}/discovery/
          if-no-files-found: warn
